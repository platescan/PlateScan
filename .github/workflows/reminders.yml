name: Streak reminders
on:
  schedule:
    - cron: '7 * * * *'   # every hour (GitHub may run it a few minutes late)
  workflow_dispatch:       # lets you run it by hand from the Actions tab
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save firebase-admin@14.5.0 web-push@3.6.7
      - run: node reminders/send.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
